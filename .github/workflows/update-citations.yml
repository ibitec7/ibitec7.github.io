name: Update Google Scholar citations

on:
  schedule:
    # Mondays at 06:17 UTC (off the hour so it does not queue with other cron jobs).
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_publications/**"
      - "scripts/fetch_google_scholar_citations.py"
      - ".github/workflows/update-citations.yml"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --soft keeps the job green when Google serves a captcha to the runner;
      # the committed data file is then simply left as it is.
      - name: Refresh _data/citations.yml
        run: python3 scripts/fetch_google_scholar_citations.py --soft

      - name: Commit changes
        run: |
          if git diff --quiet -- _data/citations.yml; then
            echo "Citation data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          git commit -m "Update Google Scholar citation counts"
          git push
