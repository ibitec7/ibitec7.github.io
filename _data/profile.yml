short_bio: >-
  <p>
    I am an undergraduate researcher in Data Science at the City University of Hong Kong and a research-track Student Ambassador at the NVIDIA AI Technology Center Hong Kong. I study neural architectures at the operator level: what each operator does to its inputs under the data's native measure, rather than where its parameters sit in a coordinate frame. That view covers problems which otherwise look separate, including context conditioning, low-bit quantization, MoE routing, model compression, and behavioural bounds. It replaces weight-space distance proxies with operator action as the invariant a transformation must respect, so a modification carries a guarantee rather than an empirical hope.
  </p>

