- name: "Migration Surge Prediction: An Early Warning System"
  language: "Python"
  subtitle: "SDSC 2005 · Introduction to Computational Social Science · City University of Hong Kong"
  show_on_home: true
  tags: [Time series, NLP, TensorRT, cuML, Polars]
  summary: >-
    An early warning system for US visa-issuance surges that fuses 170k+ news
    articles, Google Trends interest and real exchange-rate signals across 15
    origin countries into one panel. News is embedded, clustered and labelled
    on quantized TensorRT engines, and a horizon-aware ensemble forecasts
    surges one to six months ahead.
  metrics:
    - "Walk-forward F1 0.96 at a 1-month lead, 0.86 at 6 months; recall never below 0.92"
    - "170,784 articles crawled and filtered to 104,333, clustered with cuML HDBSCAN"
    - "Jina v5 embeddings at ~20k tokens/s via TensorRT INT4 (cosine 0.9999 vs FP32)"
    - "58 of 392 country-event-lag signals survive Benjamini-Hochberg correction"
  links:
    Report (PDF): "/assets/docs/migration-surge-ews-report.pdf"
    Code: "https://github.com/ibitec7/migration"
    Datasets: "https://huggingface.co/sdsc2005-migration"

- name: "NVIDIA Stock Analysis Dashboard"
  language: "Python"
  subtitle: "Streamlit and Plotly dashboard with LLM-backed signals"
  show_on_home: true
  image: "/assets/images/projects/stock-analysis-poster.png"
  tags: [Fintech, LLM, Sentiment, Data fusion]
  summary: >-
    Fuses ten years of NVDA price history with 7,000+ collected news articles
    into sentiment-driven signals, technical overlays and hypothetical trade
    analysis. Sentiment runs through FinBERT and VADER, the technical layer
    through the indicators-cli package, and the narrative layer through an LLM.
  metrics:
    - "Market data, news sentiment, technical indicators and trade simulation in one view"
  links:
    Code: "https://github.com/ibitec7/stock"

- name: "Indicators CLI"
  language: "Python"
  subtitle: "Open-source command-line tool, published on PyPI"
  show_on_home: true
  tags: [CLI, ETL, Finance, PyPI, Testing]
  summary: >-
    Fetches historical prices from Yahoo Finance and computes nine technical
    indicators across four timeframes, for one ticker or a batch, writing CSV,
    JSON, Parquet or Excel. Packaged, documented and released on PyPI, and
    reused as a dependency by the stock dashboard.
  metrics:
    - "9 indicators (SMA, EMA, MACD, RSI, Bollinger, ATR, OBV, ROC, Stochastic)"
    - "Batch tickers, custom configs, templates and optional GPU path"
  links:
    PyPI: "https://pypi.org/project/indicators-cli/"
    Code: "https://github.com/ibitec7/indicators-cli"

- name: "IoT Sensor Simulator"
  language: "Rust"
  subtitle: "Open-source Kubernetes and Kafka deployment"
  show_on_home: true
  tags: [Rust, Kafka, Kubernetes, Microservices]
  summary: >-
    Live IoT sensor data is scarce and usually paywalled. This project
    replaces it with a configurable Rust producer/consumer fleet on Kafka,
    deployed to Kubernetes through ConfigMaps, so a simulation can be scaled to
    any stream rate and wired into other microservices.
  links:
    Code: "https://github.com/ibitec7/iot-simulator"

- name: "SMS Scam Detection: MLOps Pipeline"
  language: "Jupyter Notebook"
  subtitle: "Tracked, reproducible classification experiments"
  show_on_home: false
  image: "/assets/images/projects/sms-spam-detection-poster.png"
  tags: [MLOps, NLP, Scikit-learn, MLflow]
  summary: >-
    An end-to-end pipeline over 5,574 labelled SMS messages that compares five
