- name: "Portfolio Analysis and Optimization"
  language: "Jupyter Notebook"
  subtitle: "GE2260 · Introduction to Finance · City University of Hong Kong"
  show_on_home: false
  image: "/assets/images/projects/portfolio-optimization-poster.png"
  tags: [Quantitative finance, Statistics, Markowitz, Monte Carlo]
  summary: >-
    Constructs a 60/40 fixed-income and growth portfolio from five years of
    price history, then locates the efficient frontier with Markowitz
    mean-variance optimization and 20,000 Monte Carlo paths. The growth sleeve
    prices 18.3% expected annual return at 11.5% volatility, and the blended
    portfolio is projected to beat the S&P 500 on return and drawdown alike.
  metrics:
    - "20,000 Monte Carlo simulations; collar hedge for high-volatility regimes"
    - "Diversification verified across a five-year correlation matrix"
  links:
    Report (PDF): "/assets/docs/portfolio-analysis-ge2260.pdf"
    Video: "https://drive.google.com/file/d/1B-Y17R-3CZmWDVcAB368evj0cL1ToSFe/view?usp=sharing"
    Code: "https://github.com/ibitec7/portfolio"
